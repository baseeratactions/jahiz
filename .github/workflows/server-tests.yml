name: Client-system server tests
on:
  pull_request:
    paths: ['server/**', 'tests/**', '.github/workflows/server-tests.yml']
  push:
    branches: [main]
    paths: ['server/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/server-roles.test.cjs
